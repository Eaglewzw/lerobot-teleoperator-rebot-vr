# reBot B601-DM VR 遥操作 | POS_VEL + split
# 保守起始 profile，需在实机小幅动作和 CSV 诊断后逐步调高。
motor_control_mode: pos_vel

# 机器人
robot:
  robot_port: /dev/ttyACM0
  robot_id: rebot_b601_vr
  can_adapter: damiao
  dm_serial_baud: 921600
  no_calibrate: false  # true: 跳过启动校准

# VR 数据源
vr_source:
  hand: right
  host: 0.0.0.0
  port: 63901

# 位姿映射：split 的腕部直接跟随相对旋转，默认增加适度滤波和小死区。
cartesian_mapping:
  linear_ff_max_speed_m_s: 0.3  # Cartesian feedforward norm limit, not joint speed.
  linear_ff_max_acceleration_m_s2: 1.0
  linear_ff_max_deceleration_m_s2: 4.0  # Only removes confirmed old-direction feedforward.
  linear_ff_brake_confirm_s: 0.03  # Also requires at least two distinct samples.
  linear_ff_jump_speed_m_s: 1.0  # Reject derivative if displacement exceeds slack + speed * dt.
  linear_ff_jump_slack_m: 0.005
  position_scale: 1.0
  orientation_scale: 1.0
  position_filter_hz: 4.0  # 0: 关闭滤波
  orientation_filter_hz: 4.0  # 0: 关闭滤波
  position_deadband_m: 0.005
  orientation_deadband_deg: 0.5

# split 逆运动学
qp_ik:
  qp_use_sent_velocity: false  # Experimental; combined real-motion trial failed.
  split_contour_weight: 1.0  # 1: original isotropic task; >1 penalizes transverse error.
  split_reference_speed_m_s: 0.0  # 0: disabled; governs position and velocity together.
  split_reference_acceleration_m_s2: 1.5
  qp_solver: scipy  # scipy | osqp；仅用于 q1-q3 位置 QP
  ik_mode: split
  qp_position_cost: 20.0  # q1-q3 joint4 位置任务
  qp_orientation_cost: 2.0  # split 不使用，保留完整配置结构
  qp_orientation_cost_min: 0.05  # split 不使用
  qp_position_gain: 6.0  # q1-q3 位置误差增益
  qp_orientation_gain: 4.0  # split 中作为 q4-q6 腕部误差增益
  qp_damping: 0.001
  qp_damping_max: 0.1
  qp_smoothness_cost: 0.05
  qp_posture_cost: 0.01
  singularity_threshold: 0.08
  singularity_critical_threshold: 0.02
  singularity_characteristic_length_m: 0.3
  joint_limit_margin_deg: 2.0
  qp_max_solve_time_ms: 8.0
  urdf: null  # null: 使用内置模型

# 运动限制：低于 pose 默认值，确认方向与连续性后再逐步调高。
motion_limits:
  max_joint_speed_rad_s: 3.0  # q1-q3
  max_joint_acceleration_rad_s2: 10.0  # q1-q3
  wrist_speed_rad_s: 4.0  # q4-q6
  wrist_acceleration_rad_s2: 15.0  # q4-q6
  max_relative_target_deg: 12.0  # q1-q3 命令-反馈窗口
  wrist_relative_target_deg: 12.0  # q4-q6 命令-反馈窗口
  arm_command_lookahead_ms: 50.0
  wrist_command_lookahead_ms: 25.0

# 启动与退出
startup:
  initial_q: [0.0, 0.8, 0.8, 0.0, 0.0, 0.0]  # q1-q6, rad
  move_to_initial: true
  initial_move_tolerance_deg: 2.0
  exit_zero_tolerance_deg: 2.0  # Independent of startup tolerance.
  initial_move_timeout: 30.0
  initial_stall_timeout: 5.0
  initial_feedback_request_hz: 20.0  # 0: 不限频
  return_to_zero_on_exit: true
  exit_zero_speed_rad_s: 0.5
  exit_zero_acceleration_rad_s2: 1.0

# 夹爪
gripper:
  gripper_control_mode: force_pos  # force_pos | mit
  gripper_torque_ratio: 0.2  # [0, 1]
  gripper_mit_kp: 8.0  # 仅 gripper_control_mode=mit 使用
  gripper_mit_kd: 0.3  # 仅 gripper_control_mode=mit 使用
  gripper_open_deg: -180.0  # Trigger=0
  gripper_closed_deg: 0.0  # Trigger=1
  gripper_max_speed_deg_s: 1200.0
  gripper_max_acceleration_deg_s2: 5000.0
  gripper_relative_target_deg: null  # null: 跟随 max_relative_target_deg

# 安全
safety:
  stale_timeout: 0.2
  grip_press: 0.60
  grip_release: 0.40
  feedback_fault_max_consecutive: 5
  feedback_fault_settle_time: 0.25
  disable_torque_on_disconnect: true
  disable_attempts: 3
  disable_interval_s: 0.02
  disable_feedback_wait_s: 0.1
  disable_request_feedback: true

# 运行
runtime:
  fps: 90.0
  duration: 0.0  # 0: 持续运行
  status_rate: 5.0
  csv_log: null  # null: 不记录
  log_level: INFO
