# Dual-arm high-speed lateral-sway suppression candidate.
# Baseline feel preserved: original gains, limits, lookahead, and mapping.
#   1. shoulder_lateral contour weight 25, speed-gated (engages only above
#      0.10-0.25 m/s feedforward, holds 350 ms through braking, releases 250 ms)
#   2. bounded q1-q3 absolute position reference (2 deg) with the 50 ms
#      lookahead lead preserved on top; clears on stop/HOLD/stale
vr:
  host: 0.0.0.0
  port: 63901

arms:
  left:
    hand: left
    robot_port: /dev/serial/by-path/pci-0000:05:00.3-usb-0:2:1.0
    robot_id: rebot_left
    control_config: mit_split.yaml
    overrides:
      startup:
        initial_move_tolerance_deg: 4.0  # Accept the observed ~3.3 deg startup residual.
        exit_zero_tolerance_deg: 3.0  # Independent of startup; never relax to hide residuals.
      cartesian_mapping:
        position_scale: 0.5
        orientation_scale: 0.6
      motion_limits:
        max_joint_speed_rad_s: 2.0
        max_joint_acceleration_rad_s2: 6.0
        wrist_speed_rad_s: 2.0
        wrist_acceleration_rad_s2: 6.0
        max_relative_target_deg: 10.0
        wrist_relative_target_deg: 10.0
        gripper_relative_target_deg: 5.0  # Preserve the previous gripper window.
      qp_ik:
        split_contour_mode: shoulder_lateral
        split_contour_weight: 25.0
        split_contour_speed_gate: true
      mit:
        mit_arm_reference_error_deg: 2.0
  right:
    hand: right
    robot_port: /dev/serial/by-path/pci-0000:05:00.4-usb-0:2:1.0
    robot_id: rebot_right
    control_config: mit_split.yaml
    overrides:
      startup:
        exit_zero_tolerance_deg: 3.0
      cartesian_mapping:
        position_scale: 0.5
        orientation_scale: 0.6
      motion_limits:
        max_joint_speed_rad_s: 2.0
        max_joint_acceleration_rad_s2: 6.0
        wrist_speed_rad_s: 2.0
        wrist_acceleration_rad_s2: 6.0
        max_relative_target_deg: 10.0
        wrist_relative_target_deg: 10.0
        gripper_relative_target_deg: 5.0  # Preserve the previous gripper window.
      qp_ik:
        split_contour_mode: shoulder_lateral
        split_contour_weight: 25.0
        split_contour_speed_gate: true
      mit:
        mit_arm_reference_error_deg: 2.0

coordination:
  fault_policy: hold_both

runtime:
  duration: 0.0
  heartbeat_timeout_s: 0.5
  log_dir: ../logs/dual
