# Two upright B601 arms, parallel and facing the same direction.
# Full mit_split profile speed: 1.0 pose scales, 2.0 rad/s, 6.0 rad/s^2.
# These are configured control limits, not motor hardware maximum ratings.
# Physical arm mapping verified after USB re-enumeration; keep these USB sockets.
# by-path identifies the USB socket, not the arm itself: do not exchange cables.
# Relative paths below are resolved against this YAML's directory.
vr:
  host: 0.0.0.0
  port: 63901

arms:
  left:
    hand: left
    robot_port: /dev/serial/by-path/pci-0000:05:00.3-usb-0:2:1.0
    robot_id: rebot_left
    control_config: mit_split.yaml
    overrides:
      startup:
        initial_move_tolerance_deg: 4.0  # Accept the observed ~3.3 deg startup residual.
        exit_zero_tolerance_deg: 3.0  # Independent of startup; never relax to hide residuals.
      cartesian_mapping:
        position_scale: 1.0
        orientation_scale: 1.0
      motion_limits:
        max_joint_speed_rad_s: 2.0
        max_joint_acceleration_rad_s2: 6.0
        wrist_speed_rad_s: 2.0
        wrist_acceleration_rad_s2: 6.0
        max_relative_target_deg: 10.0
        wrist_relative_target_deg: 10.0
        gripper_relative_target_deg: 5.0  # Preserve the previous gripper window.
  right:
    hand: right
    robot_port: /dev/serial/by-path/pci-0000:05:00.4-usb-0:2:1.0
    robot_id: rebot_right
    control_config: mit_split.yaml
    overrides:
      startup:
        exit_zero_tolerance_deg: 3.0
      cartesian_mapping:
        position_scale: 1.0
        orientation_scale: 1.0
      motion_limits:
        max_joint_speed_rad_s: 2.0
        max_joint_acceleration_rad_s2: 6.0
        wrist_speed_rad_s: 2.0
        wrist_acceleration_rad_s2: 6.0
        max_relative_target_deg: 10.0
        wrist_relative_target_deg: 10.0
        gripper_relative_target_deg: 5.0  # Preserve the previous gripper window.

coordination:
  fault_policy: hold_both

runtime:
  duration: 0.0
  heartbeat_timeout_s: 0.5
  log_dir: ../logs/dual
