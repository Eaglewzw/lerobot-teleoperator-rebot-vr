# reBot B601-DM VR teleoperation: MIT motor mode
motor_control_mode: mit

robot:
  robot_port: /dev/ttyACM0
  robot_id: rebot_b601_vr
  can_adapter: damiao
  dm_serial_baud: 921600
  no_calibrate: false

vr_source:
  backend: xrobotoolkit_v1
  hand: right
  host: 0.0.0.0
  port: 63901
  no_cloudxr_launch: false

cartesian_mapping:
  position_scale: 1.0
  orientation_scale: 1.0
  position_filter_hz: 0.0
  orientation_filter_hz: 0.0
  position_deadband_m: 0.0
  orientation_deadband_deg: 0.0

qp_ik:
  qp_solver: scipy
  ik_mode: pose
  qp_position_cost: 20.0
  qp_orientation_cost: 2.0
  qp_orientation_cost_min: 0.05
  qp_position_gain: 10.0
  qp_orientation_gain: 8.0
  qp_damping: 0.001
  qp_damping_max: 0.1
  qp_smoothness_cost: 0.05
  qp_posture_cost: 0.01
  singularity_threshold: 0.08
  singularity_critical_threshold: 0.02
  singularity_characteristic_length_m: 0.3
  joint_limit_margin_deg: 2.0
  qp_max_solve_time_ms: 8.0
  urdf: null

motion_limits:
  max_joint_speed_rad_s: 5.5
  max_joint_acceleration_rad_s2: 20.0
  wrist_speed_rad_s: 12.0
  wrist_acceleration_rad_s2: 60.0
  max_relative_target_deg: 20.0
  wrist_relative_target_deg: 20.0
  arm_command_lookahead_ms: 50.0
  wrist_command_lookahead_ms: 25.0

mit:
  mit_kp: [36.0, 36.0, 36.0, 10.0, 10.0, 10.0]
  mit_kd: [4.0, 4.0, 4.0, 1.0, 1.0, 1.0]
  mit_torque_limit_nm: [27.0, 27.0, 27.0, 7.0, 7.0, 7.0]
  mit_gravity_scale: 1.0
  mit_gravity_ramp_s: 0.0
  mit_dynamics_urdf: null

startup:
  initial_q: [0.0, 0.8, 0.8, 0.0, 0.0, 0.0]
  move_to_initial: true
  initial_move_tolerance_deg: 2.0
  initial_move_timeout: 30.0
  initial_stall_timeout: 5.0

gripper:
  gripper_control_mode: force_pos
  gripper_torque_ratio: 0.2
  gripper_open_deg: -180.0
  gripper_closed_deg: 0.0
  gripper_max_speed_deg_s: 1200.0
  gripper_max_acceleration_deg_s2: 5000.0
  gripper_relative_target_deg: null

safety:
  stale_timeout: 0.2
  grip_press: 0.60
  grip_release: 0.40
  feedback_fault_max_consecutive: 5
  feedback_fault_settle_time: 0.25
  disable_torque_on_disconnect: true

runtime:
  fps: 90.0
  duration: 0.0
  status_rate: 5.0
  csv_log: null
  log_level: INFO
