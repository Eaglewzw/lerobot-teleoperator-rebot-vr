# reBot B601-DM VR 遥操作 | MIT + pose
# 完整 TCP 位姿 QP 的显式 profile；参数与兼容默认 config/mit.yaml 一致。
motor_control_mode: mit

# 机器人
robot:
  robot_port: /dev/ttyACM0
  robot_id: rebot_b601_vr
  can_adapter: damiao
  dm_serial_baud: 921600
  no_calibrate: false  # true: 跳过启动校准

# VR 数据源
vr_source:
  hand: right
  host: 0.0.0.0
  port: 63901

# 位姿映射
cartesian_mapping:
  position_scale: 1.0
  orientation_scale: 1.0
  position_filter_hz: 4.0  # 0: 关闭滤波
  orientation_filter_hz: 0.0  # 0: 关闭滤波
  position_deadband_m: 0.015
  orientation_deadband_deg: 0.0

# pose QP 逆运动学
qp_ik:
  qp_solver: scipy  # scipy | osqp
  ik_mode: pose
  qp_position_cost: 20.0
  qp_orientation_cost: 2.0
  qp_orientation_cost_min: 0.05  # 奇异区姿态权重下限
  qp_position_gain: 4.0
  qp_orientation_gain: 2.0
  qp_damping: 0.001
  qp_damping_max: 0.1
  qp_smoothness_cost: 0.05
  qp_posture_cost: 0.01
  singularity_threshold: 0.08
  singularity_critical_threshold: 0.02
  singularity_characteristic_length_m: 0.3
  joint_limit_margin_deg: 2.0
  qp_max_solve_time_ms: 8.0
  urdf: null  # null: 使用内置模型

# 运动限制
motion_limits:
  max_joint_speed_rad_s: 2.0  # q1-q3
  max_joint_acceleration_rad_s2: 6.0  # q1-q3
  wrist_speed_rad_s: 2.0  # q4-q6
  wrist_acceleration_rad_s2: 6.0  # q4-q6
  max_relative_target_deg: 10.0  # q1-q3 命令-反馈窗口
  wrist_relative_target_deg: 10.0  # q4-q6 命令-反馈窗口
  arm_command_lookahead_ms: 50.0
  wrist_command_lookahead_ms: 25.0

# MIT 控制（与 IK 算法无关，先用分轴调参验证）
mit:
  mit_kp: [25.0, 30.0, 30.0, 10.0, 10.0, 10.0]  # q1-q6
  mit_kd: [5.0, 5.0, 4.0, 0.5, 0.5, 0.5]  # q1-q6
  mit_torque_limit_nm: [27.0, 27.0, 27.0, 7.0, 7.0, 7.0]  # q1-q6
  mit_gravity_scale: 1.0  # [0, 2]
  mit_gravity_ramp_s: 1.5  # 0: 立即启用
  mit_dynamics_urdf: null  # null: 使用内置模型

# 启动与退出
startup:
  initial_q: [0.0, 0.8, 0.8, 0.2, 0.0, 0.0]  # q1-q6, rad
  move_to_initial: true
  initial_move_tolerance_deg: 3.0
  exit_zero_tolerance_deg: 3.0  # Independent of startup tolerance.
  initial_move_timeout: 30.0
  initial_stall_timeout: 5.0
  initial_feedback_request_hz: 20.0  # 0: 不限频
  return_to_zero_on_exit: true
  exit_zero_speed_rad_s: 0.5
  exit_zero_acceleration_rad_s2: 1.0

# 夹爪
gripper:
  gripper_control_mode: force_pos  # force_pos | mit
  gripper_torque_ratio: 0.2  # [0, 1]
  gripper_mit_kp: 8.0  # 仅 gripper_control_mode=mit 使用
  gripper_mit_kd: 0.3  # 仅 gripper_control_mode=mit 使用
  gripper_open_deg: -180.0  # Trigger=0
  gripper_closed_deg: 0.0  # Trigger=1
  gripper_max_speed_deg_s: 1200.0
  gripper_max_acceleration_deg_s2: 5000.0
  gripper_relative_target_deg: null  # null: 跟随 max_relative_target_deg

# 安全
safety:
  stale_timeout: 0.2
  grip_press: 0.60
  grip_release: 0.40
  feedback_fault_max_consecutive: 5
  feedback_fault_settle_time: 0.25
  disable_torque_on_disconnect: true
  disable_attempts: 3
  disable_interval_s: 0.02
  disable_feedback_wait_s: 0.1
  disable_request_feedback: true

# 运行
runtime:
  fps: 90.0
  duration: 0.0  # 0: 持续运行
  status_rate: 5.0
  csv_log: null  # null: 不记录
  log_level: INFO
